<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선생님 대시보드 · 범온누리 에듀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .login-card{max-width:380px;width:100%;padding:28px}
  .login-card h2{margin:0 0 18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px}
  /* 대시보드 */
  .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
  .dash{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 56px)}
  .side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px}
  .side h3{font-size:13px;color:var(--mute);margin:8px 6px}
  .class-item{padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .class-item:hover{background:var(--soft)}
  .class-item.active{background:var(--soft);border-color:var(--accent)}
  .class-item .cn{font-weight:700}
  .class-item .cc{font-size:12.5px;color:var(--mute);font-family:monospace;letter-spacing:.05em}
  .main{overflow-y:auto;padding:22px}
  .help-banner{background:#fff4e5;border:1px solid #ffe0b2;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .help-banner.hidden{display:none}
  .card-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
  .scard .sn{font-weight:700}
  .scard .sp{font-size:13px;color:var(--mute);margin-top:4px}
  .scard .plist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .plink{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--soft);cursor:pointer}
  .plink:hover{background:#e2e9fb}
  .code-box{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .code-box .code{font-family:monospace;font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
  /* 개입 모달 */
  .modal{position:fixed;inset:0;background:rgba(20,30,60,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:16px;width:min(1000px,96vw);height:min(720px,92vh);display:grid;grid-template-columns:340px 1fr;overflow:hidden}
  .mv-left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .mv-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .mv-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .mvmsg{max-width:90%;padding:8px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap}
  .mvmsg.me{background:var(--accent);color:#fff;align-self:flex-end}
  .mvmsg.bot{background:var(--soft);align-self:flex-start}
  .mvmsg.sys{background:#fff4e5;color:#8a5a12;align-self:center;font-size:12px}
  .mv-compose{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
  .mv-compose input{flex:1;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px}
  .mv-right{display:flex;flex-direction:column;min-width:0}
  .mv-right iframe{flex:1;border:none;width:100%}
  .hint{font-size:12px;color:var(--mute);padding:6px 12px}
  @media(max-width:820px){.dash{grid-template-columns:1fr}.side{display:none}.modal-box{grid-template-columns:1fr}.mv-right{display:none}}
</style>
</head>
<body>
<!-- 로그인 화면 -->
<div id="loginView" class="center-wrap">
  <div class="login-card card">
    <div class="brand-row" style="margin-bottom:16px"><span class="brand-dot"></span> 범온누리 에듀 · 선생님</div>
    <h2>관리자 로그인</h2>
    <form id="loginForm" class="stack">
      <div class="field"><label>아이디</label><input class="input" id="u" autocomplete="username"></div>
      <div class="field"><label>비밀번호</label><input class="input" id="p" type="password" autocomplete="current-password"></div>
      <button class="btn" id="loginBtn" type="submit">로그인</button>
    </form>
    <div class="muted" style="margin-top:14px;font-size:13px"><a href="/">← 학생 참여 페이지로</a></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashView" style="display:none">
  <div class="topbar">
    <div class="brand-row"><span class="brand-dot"></span> 범온누리 에듀 · 선생님</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="tag" id="liveTag" style="display:none">🟢 실시간 연결됨</span>
      <button class="btn line sm" id="adminLogout">로그아웃</button>
    </div>
  </div>
  <div class="dash">
    <aside class="side">
      <h3>내 반</h3>
      <div id="classList"></div>
      <button class="btn ghost sm" id="newClassBtn" style="width:100%;margin-top:10px">+ 새 반 만들기</button>
    </aside>
    <main class="main" id="main">
      <div class="muted">왼쪽에서 반을 선택하거나 새 반을 만들어보세요.</div>
    </main>
  </div>
</div>

<!-- 개입 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="mv-left">
      <div class="mv-head">
        <b id="mvTitle">개입</b>
        <button class="btn line sm" onclick="AdminUI.closeModal()">닫기</button>
      </div>
      <div class="mv-msgs" id="mvMsgs"></div>
      <div class="hint">💡 학생 화면에는 이 대화가 보이지 않아요. '수정 중'과 결과만 표시됩니다.</div>
      <form class="mv-compose" id="mvCompose">
        <input id="mvInput" placeholder="AI에게 지시… 예: 제목을 크게, 색을 파랑으로">
        <button class="btn sm" type="submit">보내기</button>
      </form>
    </div>
    <div class="mv-right">
      <div class="hint" style="padding:12px 14px;border-bottom:1px solid var(--line)">학생 페이지 미리보기 (실시간)</div>
      <iframe id="mvPreview" title="학생 페이지"></iframe>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
let token=EB.tok.getAdmin();
let classes=[], activeClass=null, ws=null, curProject=null;

const AdminUI={
  async closeModal(){ document.getElementById('modal').classList.remove('show'); curProject=null; }
};

// ── 로그인 ──
function showDash(){ document.getElementById('loginView').style.display='none'; document.getElementById('dashView').style.display='block'; }
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{
    const r=await EB.api('POST','/api/auth/admin/login',{username:document.getElementById('u').value.trim(),password:document.getElementById('p').value});
    EB.tok.setAdmin(r.token); token=r.token; showDash(); loadClasses();
  }catch(err){ EB.toast(err.message); }
  finally{ btn.disabled=false; btn.textContent='로그인'; }
});
document.getElementById('adminLogout').addEventListener('click',()=>{ EB.tok.clearAdmin(); location.reload(); });

// ── 반 ──
async function loadClasses(){
  const r=await EB.api('GET','/api/admin/classes',undefined,token);
  classes=r.classes; const box=document.getElementById('classList'); box.innerHTML='';
  if(!classes.length){ box.innerHTML='<div class="muted" style="font-size:13px;padding:6px">아직 반이 없어요.</div>'; }
  classes.forEach(c=>{
    const el=document.createElement('div'); el.className='class-item'+(activeClass&&activeClass.id===c.id?' active':'');
    el.innerHTML='<div class="cn">'+EB.esc(c.name)+'</div><div class="cc">코드 '+EB.esc(c.code)+' · 학생 '+c.student_count+'명</div>';
    el.onclick=()=>selectClass(c.id);
    box.appendChild(el);
  });
}
document.getElementById('newClassBtn').addEventListener('click', async ()=>{
  const name=prompt('반 이름을 입력하세요 (예: 1학년 3반)');
  if(!name) return;
  try{ const c=await EB.api('POST','/api/admin/classes',{name},token); await loadClasses(); selectClass(c.id); }
  catch(e){ EB.toast(e.message); }
});

async function selectClass(cid){
  const r=await EB.api('GET','/api/admin/classes/'+cid+'/students',undefined,token);
  activeClass=r.class; loadClasses(); connectClassWs(cid);
  const main=document.getElementById('main');
  let html='<div class="code-box"><div><div class="muted" style="font-size:12px">학생 참여 코드</div><div class="code">'+EB.esc(r.class.code)+'</div></div>'
    +'<button class="btn line sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+r.class.code+'\');EB.toast(\'코드를 복사했어요\')">복사</button>'
    +'<div class="muted" style="font-size:12.5px">학생들에게 이 코드를 알려주세요. 학생은 <b>'+location.origin+'</b> 에서 참여합니다.</div></div>';
  html+='<div class="help-banner hidden" id="helpBanner"></div>';
  html+='<h3 style="margin:6px 0 12px">학생 ('+r.students.length+'명)</h3>';
  if(!r.students.length){ html+='<div class="muted">아직 참여한 학생이 없어요.</div>'; }
  html+='<div class="card-row" id="studentCards"></div>';
  main.innerHTML=html;
  const box=document.getElementById('studentCards');
  r.students.forEach(s=>{
    const el=document.createElement('div'); el.className='scard';
    let ph='<div class="sn">'+EB.esc(s.name)+'</div><div class="sp">작품 '+s.project_count+'개</div><div class="plist"></div>';
    el.innerHTML=ph; box.appendChild(el);
    const pl=el.querySelector('.plist');
    (s.projects||[]).forEach(p=>{
      const row=document.createElement('div'); row.className='plink';
      row.innerHTML='<span>'+EB.esc(p.title)+'</span><span>'+(p.published?'🌐':'✏️')+' 개입</span>';
      row.onclick=()=>openIntervene(p.id);
      pl.appendChild(row);
    });
    if(!(s.projects||[]).length){ pl.innerHTML='<div class="muted" style="font-size:12.5px">작품 없음</div>'; }
  });
  refreshHelp();
}

// ── 도움 요청 ──
async function refreshHelp(){
  if(!activeClass) return;
  const r=await EB.api('GET','/api/admin/help?status=open',undefined,token);
  const mine=r.help_requests.filter(h=>h.class_id===activeClass.id);
  const banner=document.getElementById('helpBanner'); if(!banner) return;
  if(!mine.length){ banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  banner.innerHTML='<div>🙋 <b>'+mine.length+'명</b>이 도움을 기다리고 있어요.</div>'
    +'<button class="btn sm" onclick="openIntervene(\''+mine[0].project_id+'\')">'+EB.esc(mine[0].student_name)+' 도와주기 →</button>';
}

function connectClassWs(cid){
  if(ws){ try{ws.close()}catch{} }
  ws=new WebSocket(EB.wsUrl('/ws/class/'+cid+'?token='+encodeURIComponent(token)));
  ws.onopen=()=>{ document.getElementById('liveTag').style.display='inline-block'; };
  ws.onclose=()=>{ document.getElementById('liveTag').style.display='none'; setTimeout(()=>{if(activeClass&&activeClass.id===cid)connectClassWs(cid)},3000); };
  ws.onmessage=(ev)=>{
    let d; try{d=JSON.parse(ev.data)}catch{return}
    if(d.type==='help_new'){
      EB.toast('🙋 '+d.student_name+' 학생이 도움을 요청했어요!');
      // 새로 참여한 학생/작품이 목록에 없을 수 있으니 화면을 갱신한다.
      // (개입 모달이 열려 있지 않을 때만 — 작업 중 방해 방지)
      if(activeClass&&activeClass.id===cid&&!document.getElementById('modal').classList.contains('show')){
        selectClass(cid);
      }else{
        refreshHelp();
      }
    }
    else if(d.type==='help_resolved'){ refreshHelp(); }
  };
}

// ── 개입 ──
async function openIntervene(pid){
  const r=await EB.api('GET','/api/admin/projects/'+pid,undefined,token);
  curProject=r.project;
  document.getElementById('mvTitle').textContent='개입 · '+r.project.title;
  const box=document.getElementById('mvMsgs'); box.innerHTML='';
  (r.messages||[]).forEach(m=>{
    const el=document.createElement('div');
    const cls=m.role==='user'?'me':(m.role==='system'?'sys':'bot');
    el.className='mvmsg '+cls; el.textContent=m.content; box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
  await renderMvPreview(r.project.doc,r.project.title);
  document.getElementById('modal').classList.add('show');
}

async function renderMvPreview(doc,title){
  try{ const html=await EB.api('POST','/api/preview',{doc,title},token); document.getElementById('mvPreview').srcdoc=html; }catch{}
}

document.getElementById('mvCompose').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const inp=document.getElementById('mvInput'); const msg=inp.value.trim();
  if(!msg||!curProject) return;
  inp.value='';
  const box=document.getElementById('mvMsgs');
  const me=document.createElement('div'); me.className='mvmsg me'; me.textContent=msg; box.appendChild(me);
  const wait=document.createElement('div'); wait.className='mvmsg bot'; wait.textContent='…'; box.appendChild(wait); box.scrollTop=box.scrollHeight;
  try{
    const r=await EB.api('POST','/api/admin/projects/'+curProject.id+'/intervene',{message:msg},token);
    wait.textContent=r.reply; curProject.doc=r.doc;
    await renderMvPreview(r.doc,curProject.title);
    refreshHelp();
  }catch(err){ wait.textContent='⚠ '+err.message; }
  box.scrollTop=box.scrollHeight;
});

// 초기화
if(token){ showDash(); loadClasses().catch(()=>{ EB.tok.clearAdmin(); location.reload(); }); }
</script>
</body>
</html>
