<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 홈페이지 만들기 · 범온누리 에듀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{height:100vh;overflow:hidden}
  .top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
  .top .left{display:flex;align-items:center;gap:12px;min-width:0}
  .proj-title{font-weight:700;font-size:15px;border:none;background:transparent;color:var(--fg);max-width:40vw;padding:4px 6px;border-radius:6px}
  .proj-title:hover{background:var(--soft)}
  .top .right{display:flex;align-items:center;gap:8px}
  .layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 56px)}
  /* 채팅 */
  .chat{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .msg.bot{background:var(--soft);color:var(--fg);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .chip{font-size:12.5px;background:var(--soft);color:var(--accent);border:none;border-radius:999px;padding:7px 12px;cursor:pointer}
  .chip:hover{background:#e2e9fb}
  /* 진행 단계 */
  .progress{padding:12px 16px 6px;display:flex;align-items:center;gap:10px}
  .progress-bar{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress-bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:999px;transition:width .4s}
  .progress-label{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
  .composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
  .composer textarea{flex:1;resize:none;height:44px;max-height:120px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:14.5px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .send{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--accent);color:#fff;border:none;font-size:18px}
  .send:disabled{opacity:.5}
  /* 미리보기 */
  .preview{position:relative;background:var(--bg);display:flex;flex-direction:column}
  .preview-bar{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid var(--line);background:#fff}
  .device-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--mute)}
  .device-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .frame-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px}
  #preview{width:100%;max-width:100%;height:100%;border:none;background:#fff;border-radius:10px;box-shadow:var(--shadow);transition:max-width .2s}
  .frame-wrap.mobile #preview{max-width:390px}
  /* 개입 오버레이 */
  .overlay{position:absolute;inset:0;background:rgba(247,248,251,.82);backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
  .overlay.show{display:flex}
  .overlay .big{font-size:19px;font-weight:800}
  .overlay .sub{color:var(--mute);font-size:14px}
  /* 모바일 레이아웃: 탭 전환 */
  .mtabs{display:none}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr;grid-template-rows:1fr}
    .chat,.preview{grid-row:1;grid-column:1}
    .chat{display:none} .preview{display:none}
    body.tab-chat .chat{display:flex} body.tab-preview .preview{display:flex}
    .mtabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid var(--line);z-index:30}
    .mtabs button{flex:1;border:none;background:none;font-size:14px;font-weight:700;color:var(--mute)}
    .mtabs button.active{color:var(--accent)}
    .msgs{padding-bottom:70px} .frame-wrap{padding-bottom:70px}
  }
</style>
</head>
<body class="tab-chat">
<div class="top">
  <div class="left">
    <a href="/build.html" title="내 작업 목록" style="font-size:20px;text-decoration:none">🏠</a>
    <input class="proj-title" id="projTitle" value="내 홈페이지">
  </div>
  <div class="right">
    <span class="tag" id="usageTag" style="display:none"></span>
    <button class="btn line sm" id="helpBtn">🙋 도움 요청</button>
    <button class="btn sm" id="publishBtn">공개하기</button>
  </div>
</div>

<div class="layout">
  <!-- 채팅 -->
  <section class="chat">
    <div class="progress" id="progress" title="진행 단계">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">시작</div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <textarea id="input" placeholder="원하는 것을 말해보세요…" rows="1"></textarea>
      <button class="send" id="send" type="submit">↑</button>
    </form>
  </section>

  <!-- 미리보기 -->
  <section class="preview">
    <div class="preview-bar">
      <button class="device-btn active" data-d="desktop">🖥 데스크톱</button>
      <button class="device-btn" data-d="mobile">📱 모바일</button>
    </div>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="preview" title="미리보기"></iframe>
    </div>
    <div class="overlay" id="overlay">
      <div class="spinner dark" style="width:34px;height:34px;border-width:4px"></div>
      <div class="big">선생님이 수정 중이에요…</div>
      <div class="sub">잠시만 기다려 주세요. 곧 결과가 나타나요.</div>
    </div>
  </section>
</div>

<div class="mtabs">
  <button id="tabChat" class="active" onclick="EBUI.tab('chat')">💬 대화</button>
  <button id="tabPrev" onclick="EBUI.tab('preview')">👁 미리보기</button>
</div>

<script src="/assets/app.js"></script>
<script>
const token=EB.tok.getStudent();
if(!token){ location.href='/'; }
let project=null, ws=null, saveTimer=null;

const EBUI={
  tab(which){
    document.body.className='tab-'+which;
    document.getElementById('tabChat').classList.toggle('active',which==='chat');
    document.getElementById('tabPrev').classList.toggle('active',which==='preview');
  }
};

const STAGES=['purpose','name','mood','content','images','contact','polish','done'];
const STAGE_LABEL={purpose:'① 무엇을',name:'② 이름',mood:'③ 분위기·색',content:'④ 내용',images:'⑤ 사진',contact:'⑥ 연락처',polish:'⑦ 다듬기',done:'✓ 완성'};

function updateProgress(stage){
  const i=STAGES.indexOf(stage);
  const pct=i<0?0:Math.round((i/(STAGES.length-1))*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=STAGE_LABEL[stage]||'시작';
}

// 예시 답변 칩: 클릭하면 바로 답변으로 전송된다(가이드 흐름).
function renderChips(list){
  const box=document.getElementById('chips'); box.innerHTML='';
  (list&&list.length?list:['제목 바꾸기','색 바꾸기','문단 추가','사진 넣기']).forEach(t=>{
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=t;
    b.onclick=()=>sendMessage(t);
    box.appendChild(b);
  });
}

function addMsg(role,text){
  const el=document.createElement('div');
  el.className='msg '+(role==='user'?'me':'bot');
  el.textContent=text;
  const box=document.getElementById('msgs');
  box.appendChild(el); box.scrollTop=box.scrollHeight;
  return el;
}

async function renderPreview(doc,title){
  try{
    const html=await EB.api('POST','/api/preview',{doc,title},token);
    document.getElementById('preview').srcdoc=html;
  }catch(e){ /* 미리보기 실패는 조용히 무시 */ }
}

async function loadProject(){
  // build.html 에서 선택한 프로젝트 id
  const pid=localStorage.getItem('eb_project_id');
  if(!pid){ location.href='/build.html'; return; }
  try{
    const r=await EB.api('GET','/api/projects/'+pid,undefined,token);
    project=r.project;
    document.getElementById('projTitle').value=project.title;
    document.getElementById('msgs').innerHTML='';
    (r.messages||[]).forEach(m=>{ if(m.role!=='system') addMsg(m.role,m.content); });
    await renderPreview(project.doc,project.title);
    // 저장된 가이드 흐름에서 진행 단계와 예시 칩 복원
    const flow=(project.doc&&project.doc.flow)||{};
    updateProgress(flow.stage||'purpose');
    renderChips(flow.suggestions);
    connectWs(pid);
  }catch(e){
    EB.toast('프로젝트를 불러오지 못했어요: '+e.message);
    setTimeout(()=>location.href='/build.html',1500);
  }
}

function connectWs(pid){
  try{
    ws=new WebSocket(EB.wsUrl('/ws/project/'+pid+'?token='+encodeURIComponent(token)));
    ws.onmessage=(ev)=>{
      let d; try{d=JSON.parse(ev.data)}catch{return}
      if(d.type==='intervene_start'){
        document.getElementById('overlay').classList.add('show');
      }else if(d.type==='intervene_end'){
        document.getElementById('overlay').classList.remove('show');
        if(d.doc){ project.doc=d.doc; renderPreview(d.doc,project.title); }
        addMsg('assistant','✨ 선생님이 도와주셨어요! 페이지가 업데이트됐어요.');
      }else if(d.type==='doc_updated'){
        if(d.doc){ project.doc=d.doc; renderPreview(d.doc,project.title); }
      }
    };
    ws.onclose=()=>{ setTimeout(()=>{ if(project) connectWs(pid); },3000); };
  }catch(e){}
}

// 메시지 전송 (직접 입력 + 칩 클릭 공용)
async function sendMessage(text){
  const msg=(text||'').trim();
  if(!msg||!project) return;
  addMsg('user',msg);
  const send=document.getElementById('send'); send.disabled=true;
  document.getElementById('chips').innerHTML='';
  const thinking=addMsg('assistant','…');
  try{
    const r=await EB.api('POST','/api/projects/'+project.id+'/chat',{message:msg},token);
    thinking.textContent=r.reply;
    project.doc=r.doc;
    await renderPreview(r.doc,project.title);
    if(r.stage) updateProgress(r.stage);
    renderChips(r.suggestions);
    if(typeof r.remaining==='number'){
      const tag=document.getElementById('usageTag');
      tag.style.display='inline-block'; tag.textContent='오늘 남은 도움 '+r.remaining+'회';
      tag.className='tag'+(r.remaining<=5?' warn':'');
    }
  }catch(err){
    thinking.textContent='⚠ '+err.message;
    renderChips(project.doc&&project.doc.flow&&project.doc.flow.suggestions);
  }finally{ send.disabled=false; document.getElementById('input').focus(); }
}

// 폼 전송
document.getElementById('composer').addEventListener('submit',(e)=>{
  e.preventDefault();
  const inp=document.getElementById('input');
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=''; inp.style.height='44px';
  sendMessage(msg);
});

// textarea 자동 높이 + 엔터 전송
const input=document.getElementById('input');
input.addEventListener('input',()=>{input.style.height='44px';input.style.height=Math.min(120,input.scrollHeight)+'px';});
input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('composer').requestSubmit();}});

// 제목 저장(디바운스)
document.getElementById('projTitle').addEventListener('input',(e)=>{
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await EB.api('PUT','/api/projects/'+project.id,{doc:project.doc,title:e.target.value.trim()||'내 홈페이지'},token); }catch{}
  },700);
});

// 기기 미리보기 전환
document.querySelector('.preview-bar').addEventListener('click',(e)=>{
  const b=e.target.closest('.device-btn'); if(!b) return;
  document.querySelectorAll('.device-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('frameWrap').classList.toggle('mobile',b.dataset.d==='mobile');
});

// 도움 요청
document.getElementById('helpBtn').addEventListener('click', async ()=>{
  try{
    await EB.api('POST','/api/projects/'+project.id+'/help',null,token);
    EB.toast('선생님께 도움을 요청했어요! 곧 도와주실 거예요.');
  }catch(e){ EB.toast(e.message); }
});

// 공개
document.getElementById('publishBtn').addEventListener('click', async ()=>{
  try{
    const r=await EB.api('POST','/api/projects/'+project.id+'/publish',null,token);
    const url=r.url;
    await navigator.clipboard?.writeText(url).catch(()=>{});
    EB.toast('공개됐어요! 주소가 복사되었어요: '+url);
    window.open(url,'_blank');
  }catch(e){ EB.toast(e.message); }
});

loadProject();
</script>
</body>
</html>
