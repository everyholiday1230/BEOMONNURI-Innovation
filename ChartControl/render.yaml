# ============================================================
# Render 배포 설정 (Blueprint)
# ------------------------------------------------------------
# Render 에서 "New > Blueprint" → 저장소 선택 → **Blueprint 파일 경로**에
# `ChartControl/render.yaml` 을 지정한다.
#
# ★ 왜 저장소 루트에 두지 않았나
#     Render 는 기본으로 루트의 `render.yaml` 을 찾지만, 설정 화면에서 경로를
#     바꿀 수 있다. 이 저장소에는 프로젝트가 여럿 있어(superchart-ai, homepage2,
#     maeum-matchum …) 루트에 두면 어느 프로젝트의 설정인지 알 수 없고, 다른
#     프로젝트가 Blueprint 를 쓸 때 충돌한다.
#
# ★ `rootDir: ChartControl` 은 그대로 필요하다. Blueprint 파일 위치와 서비스의
#   빌드 기준 경로는 별개다 — rootDir 은 항상 **저장소 루트 기준**이다.
#
# ★★ 알고 시작할 것 — Render 의 한계
#
#   1. 아웃바운드 IP 가 고정이 아닐 수 있다(플랜·리전에 따라).
#      KuCoin Fast API 신청서와 브로커 키 IP 화이트리스트에 **서버 IP 목록**을
#      내야 한다. 고정 IP 가 필요하면 Render 의 static outbound IP 를 지원하는
#      플랜을 쓰거나, VPS 로 옮겨야 한다.
#
#   2. 무료 플랜은 15분 유휴 시 잠든다. 잠든 사이 청산 감시·WS 스트림이 멈춘다.
#      거래 서비스에서는 유료 플랜이 필요하다.
#
#   3. 무료 PostgreSQL 은 90일 후 삭제된다. 거래 기록·학습 데이터가 사라진다.
#
# ★ 브로커 키는 이 파일에 적지 않는다. Render 대시보드의 환경변수(Secret)로
#   넣는다 — 이 파일은 저장소에 커밋되므로 여기 적으면 키가 공개된다.
# ============================================================

databases:
  - name: chartcontrol-db
    databaseName: chartcontrol
    user: chartcontrol
    # ★ PostgreSQL 18 — 마이그레이션 28개와 테스트 1,873개를 18.6 에서 검증했다.
    postgresMajorVersion: "18"
    plan: basic-256mb        # 무료는 90일 후 삭제된다. 거래 기록을 잃을 수 없다.
    region: singapore        # KuCoin 상류가 아시아라 지연이 낮다.

services:
  # ---- Redis (레이트리밋) ----
  #
  # ★ Render 는 이것을 'Key Value' 라고 부른다. `type: redis` 는 폐기된 별칭이다.
  - type: keyvalue
    name: chartcontrol-redis
    # ★ Redis 8 — 프로덕션 레이트리밋이 EVAL(Lua) 만 쓰므로 호환 문제가 없다.
    #   8 시리즈에서 테스트 1,873개를 검증했다.
    plan: starter            # 무료 플랜은 영속성이 없다(재시작 시 레이트리밋 카운터 소실).
    region: singapore

    # ★★ Key Value 는 ipAllowList 가 **필수**다(생략하면 Blueprint 가 동기화되지 않는다).
    #
    #   빈 목록 = 외부 접속 차단, 같은 리전 내부망만 허용.
    #   우리 API 는 같은 리전에 있으므로 이걸로 충분하고, 인터넷에서는 닿을 수 없다.
    ipAllowList: []
    # ★★ maxmemoryPolicy 를 noeviction 으로 둔다.
    #
    #   기본값(allkeys-lru)이면 메모리가 차면 레이트리밋 키를 **조용히 버린다.**
    #   그러면 제한이 풀려 로그인 무차별 시도를 막지 못한다 — 보호가 사라진 것을
    #   아무도 모른다.
    maxmemoryPolicy: noeviction

  # ---- API + 프론트엔드 (한 서비스가 둘 다 서빙한다) ----
  - type: web
    name: chartcontrol
    runtime: node
    region: singapore
    plan: starter            # 무료는 15분 유휴 시 잠든다(청산 감시가 멈춘다).
    branch: main
    rootDir: ChartControl

    # ★★ 자동 배포를 끈다.
    #
    #   기본값은 `commit` — main 에 푸시할 때마다 **거래 중인 프로덕션이 재배포**된다.
    #   배포 중에는 KuCoin WebSocket 이 끊기고 청산 감시가 멈춘다.
    #   언제 배포할지는 사람이 정한다(대시보드의 Manual Deploy).
    autoDeployTrigger: 'off'
    buildCommand: pnpm install --frozen-lockfile && pnpm -r build
    # ★ 마이그레이션을 기동 전에 돌린다. 표가 없으면 프로덕션 기동 검사가 막는다.
    preDeployCommand: pnpm --filter @quantumtrade/api exec tsx scripts/migrate.ts up
    startCommand: pnpm --filter @quantumtrade/api exec tsx src/index.ts
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # ---- 데이터 저장소 (Render 가 자동으로 채운다) ----
      - key: DATABASE_URL
        fromDatabase:
          name: chartcontrol-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chartcontrol-redis
          property: connectionString

      # ---- 브로커 자격증명 보관 위치 ----
      #
      # ★★ AWS Secrets Manager 를 쓰지 않는 선택이다. 기본값은 AWS 요구이며,
      #   이 값을 **직접 적어야** 환경변수 경로가 열린다(실수로 열리지 않게).
      #
      # ★ 포기하는 것: 서버가 침해되면 프로세스 환경에서 브로커 키가 읽힌다.
      #   걸린 것: 운영자 브로커 키(고객 키는 별개로 DB 봉투암호화). 유출되면 남이
      #   우리 이름으로 주문 태그를 붙일 수 있지만 **자금은 빼낼 수 없다**(출금 권한 없음).
      - key: CREDENTIAL_SOURCE
        value: env

      # ---- 실주문 잠금 (기본은 전부 잠김) ----
      #
      # ★★ 다섯 겹이 모두 열려야 주문이 거래소에 도달한다. 하나만 실수로 켜져도
      #   열리지 않도록 일부러 나눠 두었다. 실거래를 열 때 대시보드에서 바꾼다.
      # ---- 실주문 (실제 돈이 움직인다) ----
      #
      # ★★ 실주문은 **다섯 개**가 모두 맞아야 열린다. 하나라도 어긋나면 주문은
      #   전송되지 않고 화면에 이유가 표시된다(리스크 게이트가 이유를 돌려준다).
      #     1) TRADING_MODE=KUCOIN_LIVE          — 사용자 자기 키로 KuCoin 에 주문
      #     2) FEATURE_LIVE_ORDERS_ENABLED=true  — 실주문 기능 플래그
      #     3) LIVE_EXECUTION_MODE=BITMART_LIVE_TRADE — 주문 변경(전송)을 허용하는 모드
      #     4) LIVE_TRADING_ENABLED=true         — 어댑터의 실전송 허용
      #     5) EMERGENCY_KILL_SWITCH=false       — 비상 정지 해제
      #
      # ★ 3~5 는 예전에 BITMART_* 이름이었다. KuCoin 실주문도 이 값들이 막기 때문에
      #   운영자가 1·2 만 켜고 "왜 안 되지" 를 겪었다. 거래소 이름이 없는 새 이름을
      #   쓰고, 옛 이름도 계속 인식한다(env.ts).
      #
      # ★★ 사고가 나면 대시보드에서 EMERGENCY_KILL_SWITCH=true 로 바꾸고 재시작하면
      #   즉시 모든 실주문이 막힌다. 이 값이 유일한 즉시 정지 수단이다.
      #
      # ★ 이것들을 켜도 다음이 없으면 개별 사용자의 주문은 나가지 않는다:
      #     · 사용자가 자기 KuCoin API 키를 연결하고 검증에 성공(credential VERIFIED)
      #     · 그 키에 선물 거래 권한(Future-Trade)이 확인됨
      #     · 시세가 LIVE, 확인 토큰·멱등키 유효, 계정 active
      - key: TRADING_MODE
        value: KUCOIN_LIVE
      - key: FEATURE_LIVE_ORDERS_ENABLED
        value: "true"
      - key: LIVE_EXECUTION_MODE
        value: BITMART_LIVE_TRADE
      - key: LIVE_TRADING_ENABLED
        value: "true"
      - key: EMERGENCY_KILL_SWITCH
        value: "false"

      # ---- 서버가 강제하는 주문 상한 ----
      #
      # ★★ 전에는 이 값들이 코드에 하드코딩돼 있었고, 검증 경로와 전송 경로의 값이
      #   서로 달랐다(BTCUSDT+ETHUSDT vs BTCUSDT). 그래서 실주문을 열어도 BTCUSDT
      #   하나만 나갔고, ETHUSDT 는 확인창을 통과한 뒤 전송에서 거부됐다.
      #
      # ★ TRADE_ALLOWED_SYMBOLS='*' 는 심볼 제한 없음이다. 상장이 664종이라 목록을
      #   손으로 관리하면 새 종목이 조용히 거부된다. 대신 아래 상한이 유일한 방어선이
      #   되므로, 레버리지·주문금액·일일 한도를 실제로 감당할 값으로 두어야 한다.
      - key: TRADE_ALLOWED_SYMBOLS
        value: "*"
      # ★ 레버리지·주문금액은 **거래소 한도를 따른다**(빈 값). 거래소는 종목마다 상한이
      #   다르고(BTC 125×) 초과 주문은 거래소가 거부한다. 우리가 더 낮은 값을 두면
      #   거래소가 허용하는 주문이 우리 쪽에서 막혀 사용자가 이유를 알 수 없다.
      #   더 보수적으로 가려면 여기에 숫자를 넣으면 그때만 추가 상한이 된다.
      - key: TRADE_MAX_LEVERAGE
        value: ""
      - key: TRADE_MAX_ORDER_NOTIONAL
        value: ""
      - key: TRADE_MAX_OPEN_POSITIONS
        value: "5"
      - key: TRADE_DAILY_ORDER_LIMIT
        value: "50"
      - key: TRADE_DAILY_LOSS_LIMIT
        value: "1000"
      - key: TRADE_PRICE_DEVIATION_PCT
        value: "5"

      # ---- 시세 (공개 API, 키 불필요) ----
      - key: DATA_MODE
        value: KUCOIN_PUBLIC

      # ---- 도메인 (CORS·메일 링크·OAuth 리다이렉트가 이 값을 쓴다) ----
      #
      # ★ 서브도메인을 Render 대시보드에서 연결한 뒤 실제 주소로 바꾼다.
      #   틀리면 CSRF 검사(origin)가 막아 로그인이 안 된다.
      - key: APP_BASE_URL
        value: https://chartcontrol.beomonnuri.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://chartcontrol.beomonnuri.com

      # ---- 법적 문서 게시 ----
      #
      # 문서 본문은 docs/legal/{terms,privacy,risk,security}-{ko,en,ja,zh}.md 에 있다.
      # 부팅 때 빠진 것을 데이터베이스에 등록한다(이미 있는 버전은 건너뛴다).
      #
      # ★★ LEGAL_AUTOPUBLISH=true 면 등록과 동시에 **공개**한다. 공개는 되돌릴 수 없다 —
      #   문구를 바꾸려면 새 버전을 만들어야 한다. 검토를 먼저 하려면 이 값을 지우고
      #   /admin/legal 에서 초안을 읽어 본 뒤 공개하면 된다.
      #
      # ★★ 파일 내용이 바뀌었고 그 버전이 아직 공개되지 않았다면, 부팅 때 초안 본문을
      #   다시 맞춘 뒤 공개한다. 낡은 초안이 그대로 게시되는 것을 막기 위해서다.
      #   **이미 공개된 문서는 절대 덮어쓰지 않는다** — 사용자가 동의한 내용이 바뀌면
      #   안 된다. 공개된 문구를 고치려면 LEGAL_VERSION 을 올려 새 버전으로 만든다.
      #
      # ★★ 공개를 막는 기준은 '연락할 방법이 있는가' 다. 실주문이 열려 있는데 문의
      #   창구(SUPPORT_EMAIL)가 하나도 없으면 공개하지 않는다. 문제가 생겼을 때
      #   연락할 방법이 없는 약관을 게시하면 안 된다.
      #
      #   운영 방침: 사업자등록번호·전화번호는 게시하지 않는다. 문의는 게시판(#/help)과
      #   이메일로 받는다. 그래서 COMPANY_INFO 는 비워 두어도 공개된다.
      #   나중에 사업자 정보를 게시하기로 하면 COMPANY_INFO 에 한 문단을 넣으면
      #   약관 끝에 그대로 붙는다(그때는 LEGAL_VERSION 을 올려야 반영된다).
      - key: LEGAL_AUTOPUBLISH
        value: "true"
      - key: LEGAL_VERSION
        value: "2026-08-22"
      - key: COMPANY_INFO
        sync: false

      # ---- 아래는 대시보드에서 직접 넣는다 (여기 적으면 공개된다) ----
      #
      # ★★ 이름이 정확해야 한다. 서버는 `env.ts` 가 읽는 이름만 본다.
      #   전에는 `CSRF_KEY` 로 적혀 있었는데 서버가 읽는 이름은 `AUTH_CSRF_KEY` 다.
      #   그 상태로 배포하면 프로덕션 기동이 **거부된다**(env.ts fail-closed).
      #   `SESSION_SECRET` · `CREDENTIAL_ENCRYPTION_KEY` 는 어디에서도 읽지 않아
      #   지웠다 — 넣어도 아무 일이 일어나지 않는데 넣었다고 안심하게 된다.
      #
      #   점검 방법: `node tools/launch-check.mjs --env <파일>` 이 차단 항목을 센다.

      # 세션·CSRF (없으면 프로덕션 기동 거부. 32자 이상 랜덤)
      - key: AUTH_CSRF_KEY
        sync: false

      # 첫 관리자.
      #
      # ★★ 프로덕션에는 관리자가 자동으로 만들어지지 않는다(개발용 씨드는 돌지 않고,
      #   가입은 모두 일반 사용자다). 그래서 배포만 하면 /admin 에 들어갈 사람이 없다.
      #
      #   순서: ① 사이트에서 본인 실제 이메일로 평소처럼 가입한다
      #         ② 이 변수에 그 이메일을 넣는다
      #         ③ 재시작(Manual Deploy 또는 Restart)하면 그 계정이 SUPER_ADMIN 이 된다
      #         ④ 로그에서 "SUPER_ADMIN 으로 올렸다" 를 확인하고 이 변수를 지운다
      #
      #   비밀번호는 넣지 않는다 — 계정은 가입 화면에서 본인이 만든다.
      #   관리자가 이미 있으면 이 변수는 무시된다(상시 승격 경로를 만들지 않는다).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # 메일 — 두 경로 중 **하나만** 채우면 된다.
      #
      # (A) 우리 메일 계정으로 직접 보낸다 (추가 비용·외부 의존 없음)
      #     SMTP_HOST  예) smtp.gmail.com · smtp.office365.com · 사내 메일 서버
      #     SMTP_PORT  465(기본, 처음부터 TLS) 또는 587(STARTTLS). 25 는 Render 가 막는다.
      #     SMTP_USER  로그인 계정 (보통 보내는 주소와 같다)
      #     SMTP_PASS  Gmail·Workspace 는 **앱 비밀번호**(2단계 인증 필요). 계정 비밀번호가 아니다.
      #   ★ 도메인 메일을 쓸 경우 SPF·DKIM 을 설정해야 스팸으로 가지 않는다.
      #   ★ Gmail 무료 계정은 하루 약 500통, Workspace 는 약 2,000통 제한이 있다.
      #
      # (B) Resend 를 쓴다 — RESEND_API_KEY 만 넣으면 된다.
      #
      # 둘 다 있으면 SMTP 를 쓴다. 둘 다 없으면 메일이 나가지 않고 기동 로그에 경고가 남는다.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # 문의처 (화면에 노출된다)
      - key: SUPPORT_EMAIL
        sync: false
      # 상호 (없으면 기본 브랜드명으로 표시된다)
      # 브랜드 이름.
      #
      # ★★ Render 대시보드에 BRAND_NAME 을 손으로 넣어 둔 값이 있으면 그 값이 화면에
      #   나온다. 여기 적은 값으로 바꾸려면 대시보드의 BRAND_NAME 도 함께 고쳐야 한다.
      #
      # 풀네임은 'ChartControl AI', 약어는 'CCAI' 를 쓴다. 약어는 로고 배지처럼
      # 풀네임이 잘리는 좁은 자리에서만 쓴다.
      - key: BRAND_NAME
        value: ChartControl AI
      - key: BRAND_SHORT_NAME
        value: CCAI

      # 브로커 리베이트 — 선물. 세 값이 모두 있어야 주문에 서명이 붙는다.
      # 하나라도 없으면 거래는 되지만 귀속되지 않아 커미션이 0 이다.
      - key: KUCOIN_BROKER_PARTNER
        sync: false
      - key: KUCOIN_BROKER_KEY
        sync: false
      - key: KUCOIN_BROKER_NAME
        sync: false

      # 브로커 리베이트 — 현물. 현물을 열기 전에 넣는다(선물 값을 재사용하면
      # 귀속이 조용히 실패한다).
      - key: KUCOIN_BROKER_SPOT_PARTNER
        sync: false
      - key: KUCOIN_BROKER_SPOT_KEY
        sync: false
      - key: KUCOIN_BROKER_SPOT_NAME
        sync: false

      # 운영자 KuCoin 키 — 브로커 정산(커미션·거래자 수)을 조회한다.
      # 없으면 수익이 실제로 들어오는지 확인할 수단이 없다.
      - key: KUCOIN_API_KEY
        sync: false
      - key: KUCOIN_API_SECRET
        sync: false
      - key: KUCOIN_API_PASSPHRASE
        sync: false

      # KuCoin Fast API(OAuth) — 켜면 이용자가 키를 손으로 만들지 않아도 된다.
      # 도메인 확정 후 KuCoin 에 신청해 발급받는다.
      - key: KUCOIN_OAUTH_CLIENT_ID
        sync: false
      - key: KUCOIN_OAUTH_REDIRECT_URI
        sync: false
