<!doctype html>
<html lang="en" data-theme="dark" data-brand="institutional-cool" data-longshort="teal-magenta" data-density="comfortable">
<head>
  <meta charset="utf-8"/>
  <!--
    반응형 viewport.

    이전에는 width=1280 으로 고정돼 있었다. 그러면 휴대폰이 데스크톱 화면을
    통째로 축소해서 보여주고, 글자를 읽을 수 없다(실제로 확인했다).
    실제 기기 폭을 쓰고 CSS 로 레이아웃을 접는다(src/mobile.css).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <title>ChartControl AI — Trading Terminal</title>

  <!--
    웹폰트 — 자체 호스팅 (IBM Plex Sans/Mono · Pretendard Variable)

    ★★ 전에는 구글 폰트와 jsDelivr 에서 직접 불러왔다. 두 가지를 고쳤다.

      1. 개인정보. 폰트를 받을 때 이용자의 IP 와 User-Agent 가 그 회사로
         전달된다. 우리가 게시한 개인정보처리방침 4절의 제3자 목록에는
         폰트 CDN 이 없다 — 방침에 없는 전달이 일어나고 있었다.
      2. 신뢰성. 외부 CDN 이 실패하면 글꼴이 바뀌고, 검증에서 실패가
         무작위 라우트에 나타난 원인도 이 요청이었다.

    글꼴 파일은 src/fonts/ 에 있고 정의는 src/fonts.css 에 있다.
    화면 모양은 이전과 같다(같은 폰트·같은 굵기·unicode-range 유지).
  -->
  <link rel="stylesheet" href="src/fonts.css"/>

  <link rel="stylesheet" href="src/tokens.css"/>
  <link rel="stylesheet" href="src/base.css"/>
  <link rel="stylesheet" href="src/components.css"/>
  <link rel="stylesheet" href="src/widgets.css"/>
  <link rel="stylesheet" href="src/pages.css"/>
  <link rel="stylesheet" href="src/pages-auth.css"/>
  <link rel="stylesheet" href="src/landing-extra.css"/>
  <link rel="stylesheet" href="src/chart-kline.css"/>
  <link rel="stylesheet" href="src/chart-indicators.css"/>
  <!-- 구현 상태 표시. 겉면 전용이며 끄면 원래 화면과 같다. -->
  <link rel="stylesheet" href="src/provenance.css"/>
  <!-- 준비 중(미지원) 표시. 이 파일만 지우면 원래 화면으로 돌아간다. -->
  <link rel="stylesheet" href="src/pending.css"/>
  <!-- 모바일 반응형. 다른 CSS 를 덮어야 하므로 마지막에 둔다. -->
  <link rel="stylesheet" href="src/mobile.css"/>
</head>
<body>
  <div id="root">
    <!-- Initial loading skeleton -->
    <div style="display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:18px; font-family: 'IBM Plex Sans', sans-serif;">
      <img src="src/ccai-logo.png" alt="ChartControl AI" style="height: 54px; width: auto; filter: drop-shadow(0 0 14px rgba(53,208,224,0.22));"/>
      <div style="display:flex; gap:6px; align-items:center;">
        <span class="dot dot--live"></span>
        <span style="font-size: 11px; color: var(--color-text-tertiary); font-family: 'IBM Plex Mono';">Loading…</span>
      </div>
    </div>
  </div>

  <!--
    React + Babel — 자체 호스팅 (vendor/)

    ★★ 전에는 unpkg.com 에서 직접 불러왔다. 폰트와 같은 문제다 —
      스크립트를 받을 때 이용자의 IP 와 User-Agent 가 그 CDN 으로 전달되고,
      우리가 게시한 개인정보처리방침 4절의 제3자 목록에는 그 CDN 이 없다.

    ★ 받은 파일이 원본과 같은지 **기존 integrity 해시로 검증했다**(3개 모두
      sha384 일치). 검증 없이 내려받아 올리면 그 시점에 바뀐 파일을 그대로
      배포하게 된다 — 프론트엔드 전체를 실행하는 스크립트이므로 그 위험이 크다.

    ★ 버전을 올릴 때도 같은 절차를 지킨다: 공식 CDN 의 integrity 값과 대조한 뒤
      교체한다. 방법은 docs/DEPLOY.md 참고.

    같은 오리진이므로 integrity/crossorigin 속성은 두지 않는다(SRI 는 교차
    오리진 무결성 검증 수단이고, 여기서는 우리가 파일을 소유한다).
  -->
  <script src="vendor/react/react.development.js" crossorigin="anonymous"></script>
  <script src="vendor/react/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="vendor/babel/babel.min.js" crossorigin="anonymous"></script>

  <!-- 전역 에러 바운더리. React 뒤·앱보다 먼저 로드되어야 한다.
       렌더 중 예외 하나로 앱 전체가 검은 화면이 되는 것을 막고 복구 UI를 띄운다. -->
  <script src="src/error-boundary.js"></script>

  <!-- i18n. 사전보다 먼저 로드되어야 register 가 동작한다.
       언어 추가: src/locales/<code>.js 를 만들고 아래에 한 줄 추가.
       지원 언어 목록·언어 선택 UI는 등록된 것에서 자동 산출되므로 코드 수정 불필요. -->
  <!--
    ★ 한국어(ko)는 등록하지 않는다 — 서비스 언어는 영어·일본어·중국어다.

      사전 파일(src/locales/*.ko.js)은 지우지 않고 남겨 두었다. 되살릴 때는
      아래에 7줄을 다시 넣으면 되고, 지원 언어 목록·언어 선택 UI 는 등록된
      사전에서 자동으로 만들어지므로 코드는 고칠 필요가 없다.

      ★ 기존 이용자의 브라우저에는 lang='ko' 가 저장되어 있을 수 있다.
        i18n 이 등록되지 않은 언어를 폴백으로 정규화한다(src/i18n.js setLocale).
        정규화하지 않으면 화면은 영어인데 버튼에는 KO 가 남는다.
  -->
  <script src="src/i18n.js"></script>
  <script src="src/locales/en.js"></script>
  <script src="src/locales/auth.en.js"></script>
  <script src="src/locales/user.en.js"></script>
  <script src="src/locales/more.en.js"></script>
  <script src="src/locales/admin.en.js"></script>
  <script src="src/locales/copilot.en.js"></script>
  <script src="src/locales/shell.en.js"></script>
  <!--
    日本語 (ja) — 부분 번역 상태에서도 안전하다.
    ★ 미번역 키는 i18n 이 en 으로 자동 폴백한다(src/i18n.js fallback='en').
      그래서 핵심 화면부터 번역하고 점진적으로 채울 수 있다.
  -->
  <script src="src/locales/ja.js"></script>
  <script src="src/locales/auth.ja.js"></script>
  <script src="src/locales/user.ja.js"></script>
  <script src="src/locales/more.ja.js"></script>
  <script src="src/locales/admin.ja.js"></script>
  <script src="src/locales/copilot.ja.js"></script>
  <script src="src/locales/shell.ja.js"></script>

  <!--
    简体中文 (zh) — 简体中文辞書.
    ★ 언어 순환 버튼은 QTI18n.available() 을 단일 출처로 쓴다(app.jsx).
      그래서 이 7줄을 넣으면 코드 수정 없이 중국어가 순환에 들어온다.
    ★ 번체(zh-TW)는 별도 사전이다. 간체 사전을 번체 화면에 쓰면 글자가
      섞여 보이므로, 필요해지면 파일을 따로 추가한다.
  -->
  <script src="src/locales/zh.js"></script>
  <script src="src/locales/auth.zh.js"></script>
  <script src="src/locales/user.zh.js"></script>
  <script src="src/locales/more.zh.js"></script>
  <script src="src/locales/admin.zh.js"></script>
  <script src="src/locales/copilot.zh.js"></script>
  <script src="src/locales/shell.zh.js"></script>

  <!-- Data + engine (plain JS) -->
  <script src="src/mock-data.js"></script>
  <script src="src/mock-stream.js"></script>
  <script src="src/mock-app-data.js"></script>

  <!-- 디자이너의 QT.I18N 을 i18n 레지스트리로 흡수하고 초기 언어를 정한다.
       mock-data.js 뒤에 와야 한다. -->
  <script src="src/i18n-bootstrap.js"></script>

  <!-- Live data bridge (plain JS). mock-*.js 뒤에 와야 QT.* 를 덮어쓸 수 있다.
       백엔드가 없으면 자동으로 목업으로 폴백하므로 정적 서버로도 그대로 동작한다. -->
  <script src="src/api-client.js"></script>
  <!--
    판단 문맥 수집 (window.QTDecisionContext).

    ★ api-client 보다 뒤여도 된다 — 주문할 때 호출되고, 그 시점에는 이미 로드돼 있다.
    ★ 없으면 문맥 없이 주문이 나간다(주문을 막지 않는다).
  -->
  <script src="src/decision-context.js"></script>
  <!--
    패널 접힘 상태 (window.QTPanelState).
    ★ 레이아웃 엔진보다 먼저 로드돼야 한다 — 엔진이 그릴 때 이 값을 읽는다.
  -->
  <script src="src/panel-state.js"></script>
  <!-- 세션·등급 상태. api-client 뒤, 화면 코드 앞이어야 한다 (등급을 먼저 알아야 메뉴가 번쩍이지 않는다). -->
  <script src="src/auth-state.js"></script>
  <!-- 등급 접근 규칙. auth-state 뒤 (등급을 알아야 판정 가능). -->
  <script src="src/access.js"></script>
  <!-- 즐겨찾기(워치리스트) — 화면 여러 곳이 같은 목록을 본다 -->
  <script src="src/favorites.js"></script>
  <!-- 사이드바 접기 상태 + 메뉴 고정 (단일 출처) -->
  <script src="src/nav-prefs.js"></script>
  <!-- 거래 모드 (현물/선물/모의). 주문 경로를 결정한다. -->
  <script src="src/trade-mode.js"></script>
  <!-- 실 잔고·포지션. auth-state 뒤여야 한다 (로그인 여부를 먼저 알아야 요청하지 않는다). -->
  <script src="src/account-data.js"></script>
  <!-- 청산 위험 경고. account-data 뒤 (포지션을 읽어 계산한다). -->
  <script src="src/risk-alerts.js"></script>
  <!-- 관리자 실데이터. /admin 라우트에 들어갈 때만 조회를 시작한다. -->
  <script src="src/admin-data.js"></script>
  <!-- 미구현 버튼 안내. 눌러도 아무 일 없는 상태를 없앤다. -->
  <!--
    즐겨찾기·시장 목록의 단일 출처.
    ★ i18n 과 api-client 뒤, 화면 컴포넌트보다 먼저 로드되어야 한다
      (window.QTMarkets 를 화면이 참조한다).
  -->
  <script type="text/babel" src="src/markets-source.jsx"></script>
  <!--
    차트 격자 (트레이드 화면 안 멀티차트).
    ★ markets-source 뒤에 둔다 — 종목 목록(QTMarkets)을 읽는다.
  -->
  <script type="text/babel" src="src/chart-grid.jsx"></script>
  <!--
    공지 팝업 (window.NoticePopup).
    ★ app.jsx 보다 먼저 로드돼야 한다 — app 이 렌더할 때 이 컴포넌트를 참조한다.
  -->
  <script type="text/babel" src="src/notice-popup.jsx"></script>
  <script src="src/pending-actions.js"></script>
  <!-- 목업/실데이터 구분 표시 -->
  <script src="src/provenance.js"></script>
  <script src="src/live-market.js"></script>
  <!-- 목업 표시 허용 판정 (단일 출처). live-market.js 다음에 와야 한다. -->
  <script src="src/mock-policy.js"></script>
  <script src="src/position-calc.js"></script>

  <!-- KLineChart 10.0.1 (UMD). Apache-2.0 — 라이선스는 vendor/klinecharts/LICENSE 참조.
       빌드 도구가 없는 구조라 UMD 번들을 직접 로드한다. JSX 파일보다 먼저 와야
       chart-kline.jsx 가 window.klinecharts 를 찾을 수 있다. -->
  <script src="vendor/klinecharts/klinecharts.min.js"></script>

  <!-- JSX components -->
  <script type="text/babel" src="src/icons.jsx"></script>
  <!-- 오버레이 실시간 라벨(진입가 대비 손익% 등). 두 차트 엔진이 공유하므로
       둘보다 먼저 로드돼야 한다. -->
  <script src="src/chart-overlay-live.js"></script>
  <script type="text/babel" src="src/chart-canvas.jsx"></script>
  <script type="text/babel" src="src/chart-kline.jsx"></script>
  <script src="src/chart-actions.js"></script>
  <script type="text/babel" src="src/chart-indicators.jsx"></script>
  <script type="text/babel" src="src/chart-compare.jsx"></script>
  <script type="text/babel" src="src/chart-settings.jsx"></script>
  <script type="text/babel" src="src/widgets.jsx"></script>
  <script type="text/babel" src="src/ai-copilot.jsx"></script>
  <script type="text/babel" src="src/layout-engine.jsx"></script>
  <script type="text/babel" src="src/tweaks.jsx"></script>
  <script type="text/babel" src="src/page-shell.jsx"></script>
  <script type="text/babel" src="src/pages-user.jsx"></script>
  <script type="text/babel" src="src/pages-admin.jsx"></script>
  <script type="text/babel" src="src/pages-auth.jsx"></script>
  <script type="text/babel" src="src/pages-more.jsx"></script>
  <!-- 포인트 (신규 기능 — 디자이너 화면이 없어 기존 컴포넌트로 조립) -->
  <script type="text/babel" src="src/pages-points.jsx"></script>
  <!-- 법적 문서 (로그인 없이 열린다) -->
  <script type="text/babel" src="src/pages-legal.jsx"></script>
  <script type="text/babel" src="src/pages-admin-more.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <!-- Mount -->
  <script type="text/babel" data-presets="react">
    function tryMount(retries = 0) {
      if (window.App && window.MarketWatch && window.SymbolHeader && window.ChartCanvas && window.AICopilot && window.useLayoutEngine && window.WidgetHost && window.TweaksPanel && window.Icons && window.PresetRibbon && window.WidgetLibrary && window.LayoutEditToolbar && window.PageShell && window.MarketsPage && window.AdminDashboardPage && window.LoginPage && window.SignupPage && window.LandingPage && window.KYCOnboardingPage && window.NotFoundPage && window.DepositPage && window.WithdrawPage && window.TransactionHistoryPage && window.StrategyDetailPage && window.ReferralPage && window.FeeRebatePage && window.HelpCenterPage && window.AdminUserDetailPage && window.AdminKYCQueuePage && window.AdminBroadcastPage && window.AdminNoticeEditorPage && window.AdminAssetsHiFiPage) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        // 전역 에러 바운더리로 감싼다 — 렌더 중 예외가 앱 전체를 검은 화면으로
        // 만들지 않고 복구 UI를 띄운다. 바운더리 로드 실패 시에는 그냥 App 을 띄운다.
        const Boundary = window.AppErrorBoundary;
        root.render(Boundary
          ? React.createElement(Boundary, null, React.createElement(window.App))
          : React.createElement(window.App));
      } else if (retries < 60) {
        setTimeout(() => tryMount(retries + 1), 100);
      } else {
        document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-family:monospace">Failed to load required scripts. Check console.</div>';
        console.error('Mount failed. Missing globals:', {
          App: !!window.App, MarketWatch: !!window.MarketWatch, ChartCanvas: !!window.ChartCanvas,
          AICopilot: !!window.AICopilot, useLayoutEngine: !!window.useLayoutEngine,
          WidgetHost: !!window.WidgetHost, TweaksPanel: !!window.TweaksPanel, Icons: !!window.Icons,
        });
      }
    }
    tryMount();
  </script>
</body>
</html>
