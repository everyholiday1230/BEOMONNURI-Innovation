# Gitleaks configuration — Phase 7 Production Security Gate.
#
# Extends the bundled ruleset (never replaces it, so new rules are picked up automatically) and adds
# a NARROW allowlist for findings that were individually reviewed and confirmed to be test fixtures
# or log text, not credentials.
#
# Policy for adding an entry here:
#   1. the value must be provably non-functional (a fake literal, a unit-test password, or log prose),
#   2. the entry must be scoped to a specific path or fingerprint — never a broad regex,
#   3. the reason must be written inline.
# Anything that cannot satisfy all three is a real finding and must be removed from the tree and
# rotated, not allowlisted.

title = "QuantumTrade AI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
Reviewed false positives (Phase 7 §2). Each fingerprint was inspected with --redact output; none is a
functional credential. Re-verified 2026-08-01 against HEAD 7e22d2f (39 commits); 5 findings all triaged (4 e2e fixtures + 1 doc prose).
"""

# Fingerprints are `path:rule:line`, so an entry stops applying if the code moves — which forces a
# re-review instead of silently covering new code.
stopwords = []

paths = [
  # Deterministic evaluation/verification logs committed as Phase 3–6 evidence. The matches are log
  # prose (e.g. "credential-free: drift_ms=-21 within_5s=true"), not secrets. These files are
  # append-only evidence and are never loaded by the application.
  '''artifacts/logs/phase3-stageA\.log''',
  # Phase 7 security triage REPORT (documentation). This markdown file's disposition table quotes the
  # fake/redacted credential-shaped example strings (AKIA…, sk-x, a test password) precisely to document
  # why each was triaged as a false positive. It is prose about non-secrets, never loaded by the app.
  # rule=generic-api-key line~201. Owner: Platform Security. Expiry: 2026-11-01 (re-review with report).
  '''docs/PHASE7-18-TEST-REPORT\.md''',
]

regexes = [
  # Fake AWS-shaped literal used by the credential-masking and redaction unit tests. It is 10 digits
  # after the prefix (a real AWS key id is 16 alphanumerics), so it cannot be a valid key. Used in
  # apps/api/src/__tests__/trading-core.test.ts, trading-routes.test.ts and
  # packages/admin-domain/src/__tests__/admin-domain.test.ts to assert masking works.
  '''AKIA1234567890''',
  # Unit-test password for the password-reset flow (apps/api/src/__tests__/auth-api.test.ts). It only
  # ever exists in an in-memory SQLite database created and destroyed by the test.
  '''resetlongenough123''',
  # Superseded Prompt 5 E2E fixture password. The WORKING TREE no longer contains it (the four
  # tests/e2e/flow-{r,s,t,u} specs now use the non-secret-shaped 'e2e-fixture-not-a-secret', which the
  # generic-api-key rule does not match — verified by a --no-git working-tree scan = 0 findings). This
  # narrow regex exists ONLY so `gitleaks detect` over immutable git history (commit 7e22d2f, which
  # cannot be rewritten — rebase/force-push are prohibited) stays clean. Provably non-functional test
  # fixture; not a whole-file or whole-rule ignore. Owner: QA + Platform Security. Expiry: 2026-11-01.
  '''longenough12345''',
  # Fake OpenAI-shaped value in the redaction test (asserts `openaiKey` is stripped).
  '''sk-x''',
]

# ============================================================
# 코드로 만든 고정 암호화 키
# ------------------------------------------------------------
# ★★ 왜 이 규칙이 필요한가 — 실제로 놓쳤다.
#
#   `apps/api/src/index.ts` 에 이런 폴백이 있었다:
#
#       const kek = env.credentialKek ?? Buffer.alloc(32, 7).toString('base64');
#
#   `Buffer.alloc(32, 7)` 은 전 바이트 0x07 인 32바이트 키다. 이것이 **공개
#   저장소에** 있었고, 그 키로 고객 거래소 API 키 3건을 복호화할 수 있었다.
#
#   gitleaks 는 이것을 잡지 못했다. 기존 규칙은 **문자열 리터럴의 엔트로피**를 본다.
#   그런데 이 키는 문자열이 아니라 **코드 표현**이다 — 엔트로피가 없다. 즉 키를
#   코드로 만들면 시크릿 스캔을 그대로 통과한다.
#
# ★ 그래서 값이 아니라 **패턴**을 잡는다. 상수 시드로 키 길이의 버퍼를 만드는 표현,
#   그리고 그것을 base64 로 바꾸는 표현을 본다.
#
# ★ 오탐이 나는 것이 정상이다. 테스트에서 고정 버퍼를 쓰는 일은 흔하다. 오탐은
#   allowlist 에 사유와 함께 추가하면 된다 — 놓치는 것보다 낫다.
# ============================================================
[[rules]]
id = "hardcoded-key-from-code"
description = "암호화 키를 코드로 만들어 상수화한 표현 (Buffer.alloc 등). 값이 아니라 패턴을 잡는다."
regex = '''Buffer\.alloc\(\s*(16|24|32|64)\s*,\s*[0-9]'''
tags = ["key", "crypto", "hardcoded"]
  # ★★ 범위를 좁힌다. 처음 규칙만 넣었더니 25건이 잡혀 게이트가 red 가 됐다.
  #   항상 빨간 게이트는 아무도 보지 않고, 그 안에 진짜 오류가 묻힌다 — 이 저장소가
  #   eslint 로 이미 겪은 실패다.
  #
  # ★ 무엇을 제외했고 왜인지 적는다. 제외 목록에 사유가 없으면 다음 사람이 이것을
  #   지워도 되는지 알 수 없다.
  [rules.allowlist]
  paths = [
    # 감사·사고 문서. 결함 코드를 **증거로 인용**한다. 인용을 막으면 사고를 기록할 수 없다.
    '''STABILIZATION-.*\.md''',
    '''LEGAL-REVIEW-REQUEST-.*\.md''',
    '''INCIDENT-.*\.md''',
    # 테스트. 고정 버퍼로 키를 만드는 것은 결정적 시험을 위해 필요하다.
    # 특히 credential-kek.test.ts 는 **이 사고의 회귀 테스트**다 — 옛 키를 재현해야
    # 재래핑이 되는지 검증할 수 있다.
    '''apps/api/src/__tests__/.*\.test\.ts''',
    # 개발 폴백. 운영은 env.ts 의 fail-closed 검사가 막고(기동 거부), 개발에서는
    # 편의를 위해 남기되 부팅 때 크게 경고한다(index.ts:3275 부근 주석 참조).
    # ★ 이 예외를 지우려면 개발 폴백을 먼저 없애야 한다. 순서를 바꾸면 개발자가
    #   매번 키를 만들어야 해서 결국 규칙을 끄게 된다.
    '''apps/api/src/index\.ts''',
    '''apps/api/src/env\.ts''',
    # 빌드 산출물. 원본(src)을 이미 검사하므로 중복이고, dist 는 커밋 대상도 아니다.
    '''apps/api/dist/.*''',
    # 재래핑 스크립트. **옛 키를 재현해야** 자격증명을 풀어 새 키로 감쌀 수 있다.
    # 이 파일이 사고 복구 수단이므로 여기서 옛 키를 다루는 것은 목적에 맞다.
    '''apps/api/scripts/rewrap-credentials\.mts''',
  ]

[[rules]]
id = "hardcoded-key-fallback"
description = "키 환경변수가 없을 때 코드로 대체하는 패턴 (?? / || 뒤에 키 생성 표현)"
regex = '''(?i)(kek|encryption[_-]?key|secret[_-]?key|master[_-]?key)\s*(=|:)\s*[^;\n]*(\?\?|\|\|)\s*[^;\n]*(Buffer\.alloc|randomBytes\(\s*\d+\s*\)\.toString|['"][A-Za-z0-9+/=]{16,}['"])'''
tags = ["key", "crypto", "fallback"]
  [rules.allowlist]
  paths = [
    '''STABILIZATION-.*\.md''',
    '''LEGAL-REVIEW-REQUEST-.*\.md''',
    '''INCIDENT-.*\.md''',
    '''apps/api/src/__tests__/.*\.test\.ts''',
    # 개발 폴백 — 위와 같은 사유.
    '''apps/api/src/index\.ts''',
    '''apps/api/dist/.*''',
    '''apps/api/scripts/rewrap-credentials\.mts''',
  ]
