<!doctype html>
<!--
  ============================================================
  TEMPLATE — Form Page
  용도: 입력 폼 (사용자 생성, 공지 작성, 프로모션 등록 등)
  ============================================================
-->
<html lang="ko" data-theme="dark" data-brand="institutional-cool">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>Form Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
  <link rel="stylesheet" href="../../src/tokens.css"/>
  <link rel="stylesheet" href="../../src/base.css"/>
  <link rel="stylesheet" href="../../src/components.css"/>
  <link rel="stylesheet" href="../../src/pages.css"/>
</head>
<body>
  <div id="root"><div style="padding:40px; color:var(--color-text-tertiary); font-family:'IBM Plex Mono';">Loading…</div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../src/mock-data.js"></script>
  <script src="../../src/mock-app-data.js"></script>
  <script type="text/babel" src="../../src/icons.jsx"></script>
  <script type="text/babel" src="../../src/widgets.jsx"></script>
  <script type="text/babel" src="../../src/page-shell.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function FormTemplatePage() {
      const [saved, setSaved] = useState(false);
      const shellProps = { activePath: '/form', role: 'user', onNavigate: (p) => window.location.hash = p };
      return (
        <window.PageShell
          {...shellProps}
          title="Form Page Template"
          subtitle="Multi-section form · 검증 · 저장 → success state"
          breadcrumb={['Home', 'New Item']}
        >
          <div style={{maxWidth: 640, margin: '0 auto', display:'flex', flexDirection:'column', gap: 16}}>
            {saved && (
              <div style={{padding:'10px 12px', background:'oklch(78% 0.14 145 / 0.10)', borderLeft:'3px solid var(--color-success)', borderRadius:4, fontSize:12}}>
                <strong>✓ 저장 완료</strong> · 방금 저장되었습니다.
              </div>
            )}

            <window.SectionCard title="1. 기본 정보" subtitle="필수 항목">
              <div style={{display:'grid', gridTemplateColumns: '1fr 1fr', gap: 12}}>
                <div className="input-group"><span className="input-group__label">이름</span><input type="text" placeholder="이름 입력"/></div>
                <div className="input-group"><span className="input-group__label">이메일</span><input type="email" placeholder="you@example.com"/></div>
                <div className="input-group" style={{gridColumn:'span 2'}}><span className="input-group__label">설명</span><input type="text" placeholder="Optional description"/></div>
              </div>
            </window.SectionCard>

            <window.SectionCard title="2. 상세 옵션">
              <div style={{display:'flex', flexDirection:'column', gap: 10}}>
                <label className="chk"><input type="checkbox"/><span className="chk__box"><window.Icons.Check size={10}/></span> 이메일 알림 활성화</label>
                <label className="chk"><input type="checkbox" defaultChecked/><span className="chk__box"><window.Icons.Check size={10}/></span> 감사 로그에 기록</label>
                <label className="chk"><input type="checkbox"/><span className="chk__box"><window.Icons.Check size={10}/></span> 다른 사용자와 공유</label>
              </div>
            </window.SectionCard>

            <window.SectionCard title="3. 카테고리">
              <div className="seg" style={{width:'100%'}}>
                <button className="seg__opt is-active" style={{flex:1}}>Option A</button>
                <button className="seg__opt" style={{flex:1}}>Option B</button>
                <button className="seg__opt" style={{flex:1}}>Option C</button>
              </div>
            </window.SectionCard>

            <div style={{display:'flex', justifyContent:'flex-end', gap: 8}}>
              <button className="btn btn--sm">취소</button>
              <button className="btn btn--sm btn--primary" onClick={() => { setSaved(true); setTimeout(() => setSaved(false), 3000); }}>
                <window.Icons.Check size={12}/> 저장
              </button>
            </div>
          </div>
        </window.PageShell>
      );
    }
    (function mount(n=0){
      if (window.PageShell && window.SectionCard && window.Icons) {
        ReactDOM.createRoot(document.getElementById('root')).render(<FormTemplatePage/>);
      } else if (n < 60) setTimeout(() => mount(n+1), 100);
    })();
  </script>
</body>
</html>
